# Pilot: one container per synced member (D-04). Copy bridge-<member> block for additional members.
# Compose secret *names* use a <member>_ prefix; files live under ./secrets/<member>/ (no prefix).
services:
  bridge-serhiy:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data/serhiy:/data
    secrets:
      - serhiy_mailbox_app_password
      - serhiy_google_client_id
      - serhiy_google_client_secret
      - serhiy_google_refresh_token
    # Image CMD is sync --watch (D-13); override only if the image lacks a default entrypoint.
    # command: ["node", "dist/index.js", "sync", "--watch"]

  # --- Additional member (copy-paste template, D-01) ---
  # bridge-alice:
  #   image: ${IMAGE}
  #   restart: unless-stopped
  #   env_file: .env.alice
  #   environment:
  #     DATA_DIR: /data
  #   volumes:
  #     - ./data/alice:/data
  #   secrets:
  #     - alice_mailbox_app_password
  #     - alice_google_client_id
  #     - alice_google_client_secret
  #     - alice_google_refresh_token

secrets:
  serhiy_mailbox_app_password:
    file: ./secrets/serhiy/mailbox_app_password
  serhiy_google_client_id:
    file: ./secrets/serhiy/google_client_id
  serhiy_google_client_secret:
    file: ./secrets/serhiy/google_client_secret
  serhiy_google_refresh_token:
    file: ./secrets/serhiy/google_refresh_token

