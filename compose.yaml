# Pilot: one container per synced member (D-04). Copy bridge-operator block for additional members
# with secrets under ./secrets/<member>/ and data at ./data/<member>.
services:
  bridge-operator:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data/operator:/data
    secrets:
      - mailbox_app_password
      - google_client_id
      - google_client_secret
      - google_refresh_token
    # Image CMD is sync --watch (D-13); override only if the image lacks a default entrypoint.
    # command: ["node", "dist/index.js", "sync", "--watch"]

  # --- Additional member (copy-paste template, D-01) ---
  # bridge-member2:
  #   image: ${IMAGE}
  #   restart: unless-stopped
  #   env_file: .env.member2
  #   environment:
  #     DATA_DIR: /data
  #   volumes:
  #     - ./data/member2:/data
  #   secrets:
  #     - member2_mailbox_app_password
  #     - member2_google_client_id
  #     - member2_google_client_secret
  #     - member2_google_refresh_token

secrets:
  mailbox_app_password:
    file: ./secrets/operator/mailbox_app_password
  google_client_id:
    file: ./secrets/operator/google_client_id
  google_client_secret:
    file: ./secrets/operator/google_client_secret
  google_refresh_token:
    file: ./secrets/operator/google_refresh_token

