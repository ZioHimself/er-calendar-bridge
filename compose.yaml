# One service = one MAILBOX_CALENDAR_URL + GOOGLE_CALENDAR_ID (see env_file).
# Credentials: secrets/serhiy/* (Compose secret names use serhiy_ prefix).
services:
  bridge-serhiy-personal:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env.bridge-serhiy-personal
    environment:
      DATA_DIR: /data
    volumes:
      - ./data/serhiy-personal:/data
    secrets:
      - serhiy_mailbox_app_password
      - serhiy_google_client_id
      - serhiy_google_client_secret
      - serhiy_google_refresh_token

  # --- More calendars: copy this service block, new env_file + data volume (D-04) ---
  # bridge-serhiy-work:
  #   env_file: .env.bridge-serhiy-work
  #   volumes:
  #     - ./data/serhiy-work:/data
  #   secrets: [serhiy_mailbox_app_password, ...]

secrets:
  serhiy_mailbox_app_password:
    file: ./secrets/serhiy/mailbox_app_password
  serhiy_google_client_id:
    file: ./secrets/serhiy/google_client_id
  serhiy_google_client_secret:
    file: ./secrets/serhiy/google_client_secret
  serhiy_google_refresh_token:
    file: ./secrets/serhiy/google_refresh_token
